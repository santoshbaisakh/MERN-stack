<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table,th,td{
            border: 2px solid cyan;
            border-collapse:collapse
        }
        h1{
            color:aqua;
        }
        /* table, th, td -> selectors, border -> properties, 2px solid cyan -> values. */
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color:aqua;">This is a HTML page</h1>
    <hr>
    <table>
        <tr>
            <th>Sl. no.</th>
            <th>name</th>
            <th>salary</th>
        </tr>
        <tr>
            <td>1</td>
            <td>rakesh</td>
            <td>23000</td>
        </tr>
        <tr>
            <td>2</td>
            <td>rishi</td>
            <td>54000</td>
        </tr>
        <tr>
            <td>3</td>
            <td>sai</td>
            <td>67000</td>
        </tr>
        <tr>
            <td>4</td>
            <td>ritesh</td>
            <td>43000</td>
        </tr>
    </table>
    <hr>
    <h2>My favorite skills are...</h2>
    <ul style="list-style: square;">
        <!-- disc, circle, square.. -->
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>Django</li>
        <li>pytorch</li>
    </ul>
    <hr>
    <h2>My favorite hobbies are....</h2>
    <ol type="a">
        <!-- we can put a,A,1,i,I... -->
        <li>do coding</li>
        <li>eating</li>
        <li>sleeping</li>
        <li>repeat</li>
    </ol>
    <hr>
    <!-- block level element -->
     <div style="background-color: aqua;">today is a good day</div>
     <br>
     <!-- inline element -->
     <div>today is a <span style="background-color: aqua;">good</span> day</div>

     <hr>

     <!-- HTML FORM -->
      <form>
        <label for="fname">First Name</label>
        <input type="text">
        <br>
        <label for="lname">Last Name</label>
        <input type="text">
        <br>
        <label for="email">Email</label>
        <input type="email">
        <br>
        <label for="password">Password</label>
        <input type="password">
        <br>
        <!-- <button>Submit</button> -->
         <input type="Submit">
          </form>
</body>

</html>
