<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="/Submit" method="post">
        <label for="Regd. no.">Registration No.-</label>
        <input type="number">
        <br><br>
        <label for="Name">Name-</label>
        <input type="text">
        <br>
        <br>
        <label for="Photo">Upload Photo-</label>
        <input type="file">
        <br><br>
        <label for="Address">Give address-</label>
        <input type="text"><br><br>
        <label for="Caste">Enter Caste:</label>
        <br>
        <input type="radio" id="UR" name="Caste" value="UR">
        <label for="UR">UR</label>
        <br>
        <input type="radio" id="OBC" name="Caste" value="OBC">
        <label for="OBC">OBC</label>
        <br>
        <label for="Phone">Enter Phone number-</label>
        <input type="tel">
        <br>
        <br>
        <input type="submit">
    </form>
</body>
</html>
