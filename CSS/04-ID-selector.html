<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID selector</title>
    <style>
        h1{
            color:red;
            background-color:yellow;
        }
        #NIT{
            color:brown;
            background-color:cyan;
        }
    </style>
</head>
<body>
    <h1 id="NIT">Today is a <b>good</b> day</h1>
    <h1>Today is a good day</h1>
    <h1>Today is a good day</h1>
    <h1>Today is a good day</h1>
    <h1>Today is a good day</h1>
</body>
</html>
