<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class selector</title>
    <style>
            h1{
                color:greenyellow;
                background-color:cyan;
            }
            .demo{
                color:blue;
                background-color:tomato;
            }
    </style>
</head>
<body>
    <h1>Today is a good day</h1>
    <h1 class="demo">Today is a good day</h1>
    <h1>Today is a good day</h1>
    <h1 class="demo">Today is a good day</h1>
    <h1>Today is a good day</h1>
    <h1 class="demo">Today is a good day</h1>
    <h1>Today is a good day</h1>
</body>
</html>
