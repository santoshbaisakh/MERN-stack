<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        .container{
           height: 90vh;
           border: 2px solid red;
           display: flex;
           flex-direction: row;
           /* flex-direction: column; */
           /* flex-direction: row-reverse; */
           /* flex-direction: column-reverse; */
           justify-content: center;
           /* justify-content: space-around; */
           /* there is half space between 1st element and body */
           /* justify-content: space-between; */
           /* There is only distance between item to item */
           /* justify-content: space-evenly; */
           /* Evenly distributed all the space */
           align-items: center;
           flex-wrap: wrap;
        }
        .item{
            height: 90px;
            width: 90px;
            border: 2px solid black;
            color: darkblue;
            background-color: cyan;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
